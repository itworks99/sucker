[project]
name = "sucker-server"
version = "0.4.0"
description = "Sucker - Visual editor and migration tool for Squid proxy configuration files"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Kon", email = "KVanyushov@gmail.com"}
]
keywords = ["squid", "proxy", "configuration", "editor", "migration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "simplejson~=3.20.2",
    "bottle~=0.13.4",
    "gunicorn~=23.0.0",
]

[project.urls]
Homepage = "https://github.com/itworks99/sucker"
Repository = "https://github.com/itworks99/sucker"
Issues = "https://github.com/itworks99/sucker/issues"

[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"
